# Workflow name which is showed in GitHub Actions.
name: Build immortalwrt for youku l1

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: "Build new firmware anyway"
        required: false
        default: "true"
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"
# Uncomment the following to run regularly. Note that the cron expression here does not contain seconds.
#  schedule:
#    - cron: 0 */18 * * *

env:
  # REPO means the OpenWrt repo you want to build from in this workflow. 
  # You can modify the REPO_NAME to any name you want, but remember not to let it have the same name in 
  # other workflows.
  REPO_NAME: immortalwrt_youkul1
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.2
  BUILD_DEPENDS:  "ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
                   bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
                   git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
                   libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
                   libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 \
                   python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
                   uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev clang file nano aria2 qemu-user-static"
  # CONFIG_FILE is the name of your own config files for compiling, you should upload these files into the root 
  # directory of your workflow repo.
  CONFIG_FILE: youkul1-immortalwrt.config
  # CUSTOM_SCRIPT_1 is the name of extra bash script you want to execute before feeds update&install.
  # CUSTOM_SCRIPT_2 is the name of extra bash script you want to execute after feeds update&install.
  # You can modify the initial settings of your firmware through these two scripts. If this is what you need,
  # please upload your scripts to the root directory of your workflow repo.
  CUSTOM_SCRIPT_1: youkul1-immortalwrt-script-1.sh
  CUSTOM_SCRIPT_2: youkul1-immortalwrt-script-2.sh
  # STORE_PRODUCTS determine whether to upload all compilation products to workflow artifacts.
  # Not only firmwires, all compiled packages will be here, including compiled but not solidified into firmware.
  STORE_PRODUCTS: false
  # STORE_FIRMWARE determine whether to upload firmwares to workflow artifacts.
  STORE_FIRMWARE: true
  # The following are options of where the firmware needs to be transfered. 
  COWTRANSFER_FIRMWARE: false
  WETRANSFER_FIRMWARE: false
  RELEASE_FIRMWARE: false
  # Change the following to your time zone.
  TIME_ZONE: Asia/Shanghai

jobs:
  check:
    name: Check for source code updates
    runs-on: ubuntu-22.04
    outputs:
      cache-hit: ${{ steps.cache-hash.outputs.cache-hit }}

    steps:
      - name: Get Commit Hash
        id: get-hash
        run: |
          git clone --depth 1 --branch $REPO_BRANCH --single-branch $REPO_URL ./
          echo "commit-hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cache-hash
        uses: actions/cache@main
        with:
          path: .${{ env.REPO_NAME }}-${{ env.REPO_BRANCH }}-commit-hash
          key: HEAD-${{ steps.get-hash.outputs.commit-hash }}

      - name: Save New Commit Hash
        if: steps.cache-hash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.get-hash.outputs.commit-hash }} | 
            tee .$REPO_NAME-$REPO_BRANCH-commit-hash

  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    needs: check
    permissions:
      contents: write
    if: needs.check.outputs.cache-hit != 'true' || github.event.inputs.force-build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $BUILD_DEPENDS
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone $TIME_ZONE
          sudo mkdir -p /workdir/
          sudo chown $USER:$GROUPS /workdir/

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth 1 --branch $REPO_BRANCH --single-branch $REPO_URL openwrt/
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Run custom-script-1
        run: |
          chmod +x $CUSTOM_SCRIPT_1
          cd openwrt/
          $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_1

      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files/ openwrt/files/
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
 
      - name: Run custom-script-2
        run: |
          chmod +x $CUSTOM_SCRIPT_2
          cd openwrt/
          $GITHUB_WORKSPACE/$CUSTOM_SCRIPT_2

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download packages
        id: download-packages
        run: |
          cd openwrt/
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt/
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      # ChinaDNS-NG is managed by HomeProxy; it has no separate LuCI app or
      # UCI config. Check the core programs and HomeProxy files in the image.
      - name: Check HomeProxy and ChinaDNS core landed in the image
        run: |
          img=$(find openwrt/bin/targets -name '*youku_yk-l1-squashfs-sysupgrade.bin' -print -quit)
          [ -n "$img" ] || { echo 'YK-L1 sysupgrade image missing'; exit 1; }
          off=$(python3 - "$img" <<'PY'
          import sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          offset = data.find(b'hsqs')
          if offset < 0:
              raise SystemExit('SquashFS filesystem missing from firmware')
          print(offset)
          PY
          )
          listing=$(mktemp)
          trap 'rm -f "$listing"' EXIT
          unsquashfs -l -o "$off" "$img" > "$listing"
          for file in usr/bin/chinadns-ng usr/bin/sing-box usr/sbin/ipset etc/init.d/homeproxy etc/config/homeproxy etc/homeproxy/dnsmasq_backup; do
            grep -Fqx "squashfs-root/$file" "$listing" \
              || { echo "Required firmware file missing: $file"; exit 1; }
          done
          echo 'HomeProxy and ChinaDNS core present (standalone ChinaDNS LuCI is not required)'
          # Validate the packaged MIPS generator without starting router services.
          set -euo pipefail
          image="$img"
          offset="$off"
          rootfs="$(mktemp -d /tmp/yk-policy.XXXXXX)"
          rmdir "$rootfs"
          trap 'if [ -n "${ubus_pid:-}" ]; then sudo kill "$ubus_pid" 2>/dev/null || true; fi; sudo rm -rf "$rootfs"; rm -f "$listing"' EXIT
          sudo unsquashfs -no-progress -o "$offset" -d "$rootfs" "$image" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$rootfs"
          init="$rootfs/etc/init.d/homeproxy"
          grep -Fq 'gen_chinadns_lists()' "$init"
          grep -Fq 'china_list.filtered' "$init"
          grep -Fq 'append_policy_rule' "$rootfs/etc/homeproxy/scripts/generate_client.uc"
          grep -Fq "'dns_routing'" "$rootfs/www/luci-static/resources/view/homeproxy/client.js"
          test "$(grep -c "^config homeproxy 'config'" "$rootfs/etc/config/homeproxy")" = 1
          bash -n "$init"
          sudo cp /usr/bin/qemu-mipsel-static "$rootfs/usr/bin/"
          sudo mkdir -p "$rootfs/tmp/run/homeproxy" "$rootfs/tmp/run/ubus" "$rootfs/tmp/lock"
          target() { sudo chroot "$rootfs" /usr/bin/qemu-mipsel-static "$@"; }
          sudo chroot "$rootfs" /usr/bin/qemu-mipsel-static /sbin/ubusd &
          ubus_pid=$!
          for attempt in {1..30}; do
              [ -S "$rootfs/tmp/run/ubus/ubus.sock" ] && break
              sleep 0.1
          done
          target /usr/bin/ucode -c -o /tmp/subscriptions.ucb /etc/homeproxy/scripts/update_subscriptions.uc
          target /usr/bin/chinadns-ng --group proxylist \
              --group-dnl /etc/homeproxy/resources/gfw_list.txt \
              --group-upstream '127.0.0.1#5333' -N tag:proxylist \
              -N 'tag:gfw,tag:none@ip:non_china' --cache 4096 -V
          # Exercise snapshot/restore with the packaged UCI, in the extracted copy.
          python3 - "$rootfs" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          init = (root / 'etc/init.d/homeproxy').read_text()
          helpers = init[init.index('save_chinadns_dnsmasq()'):init.index('start_service()')]
          (root / 'etc/config/dhcp').write_text("config dnsmasq 'ci_dnsmasq'\n\toption domain 'lan'\n")
          (root / 'tmp/check-dns-state.sh').write_text('''#!/bin/sh
          set -eu
          HP_DIR=/etc/homeproxy
          DNSMASQ_UCI_CONFIG=ci_dnsmasq
          uci() { /usr/bin/qemu-mipsel-static /sbin/uci "$@"; }
          ''' + helpers + '''
          uci set dhcp.ci_dnsmasq.noresolv=0
          uci set dhcp.ci_dnsmasq.cachesize=777
          uci add_list dhcp.ci_dnsmasq.server=192.0.2.53
          uci add_list dhcp.ci_dnsmasq.server=/lan/192.0.2.54
          uci commit dhcp
          save_chinadns_dnsmasq || exit 1
          uci delete dhcp.ci_dnsmasq.server
          uci add_list 'dhcp.ci_dnsmasq.server=127.0.0.1#5353'
          uci set dhcp.ci_dnsmasq.noresolv=1
          uci set dhcp.ci_dnsmasq.cachesize=0
          uci commit dhcp
          restore_chinadns_dnsmasq || exit 1
          test "$(uci get dhcp.ci_dnsmasq.server)" = '192.0.2.53 /lan/192.0.2.54'
          test "$(uci get dhcp.ci_dnsmasq.noresolv)" = 0
          test "$(uci get dhcp.ci_dnsmasq.cachesize)" = 777
          test "$(uci get dhcp.ci_dnsmasq.domain)" = lan
          for option in server noresolv cachesize; do uci delete "dhcp.ci_dnsmasq.$option"; done
          uci commit dhcp
          save_chinadns_dnsmasq || exit 1
          uci add_list 'dhcp.ci_dnsmasq.server=127.0.0.1#5353'
          uci set dhcp.ci_dnsmasq.noresolv=1
          uci set dhcp.ci_dnsmasq.cachesize=0
          uci commit dhcp
          restore_chinadns_dnsmasq || exit 1
          for option in server noresolv cachesize; do
              if uci -q get "dhcp.ci_dnsmasq.$option"; then exit 1; fi
          done
          # Migrate only the old integration's fingerprint, retaining local DNS.
          uci add_list 'dhcp.ci_dnsmasq.server=127.0.0.1#5353'
          uci add_list dhcp.ci_dnsmasq.server=/lan/192.0.2.54
          uci set dhcp.ci_dnsmasq.noresolv=1
          uci set dhcp.ci_dnsmasq.cachesize=0
          uci commit dhcp
          restore_chinadns_dnsmasq || exit 1
          test "$(uci get dhcp.ci_dnsmasq.server)" = /lan/192.0.2.54
          if uci -q get dhcp.ci_dnsmasq.noresolv; then exit 1; fi
          if uci -q get dhcp.ci_dnsmasq.cachesize; then exit 1; fi
          ''')
          PY
          target /bin/sh /tmp/check-dns-state.sh
          # Public fixture in the extracted copy only; never embedded in firmware.
          target /sbin/uci set homeproxy.ci_node=node
          target /sbin/uci set homeproxy.ci_node.type=socks
          target /sbin/uci set homeproxy.ci_node.address=127.0.0.1
          target /sbin/uci set homeproxy.ci_node.port=9
          target /sbin/uci set homeproxy.proxy_out.node=ci_node
          target /sbin/uci set homeproxy.routing.default_outbound=proxy_out
          target /sbin/uci set homeproxy.dns_block.domain=.Blocked.Example.
          target /sbin/uci set homeproxy.dns_proxy.domain=proxy.example
          target /sbin/uci add_list homeproxy.dns_direct.domain_suffix=direct.example
          target /sbin/uci commit homeproxy
          target /usr/bin/ucode -S /etc/homeproxy/scripts/generate_client.uc
          target /usr/bin/sing-box check -c /var/run/homeproxy/sing-box-c.json
          python3 - "$rootfs/tmp/run/homeproxy/sing-box-c.json" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          rules = config['route']['rules']
          block = next(i for i, r in enumerate(rules) if r.get('domain_suffix') == ['blocked.example'])
          assert rules[block]['action'] == 'reject'
          proxy = next(i for i, r in enumerate(rules) if r.get('domain_suffix') == ['proxy.example'])
          reject = rules[proxy - 1]
          assert block < proxy
          assert reject['type'] == 'logical' and reject['action'] == 'reject'
          assert reject['rules'][1] == {'network': 'udp', 'port': [443]}
          assert not any(r.get('domain') == '' for r in rules)
          fallback = next(i for i, r in enumerate(rules) if r.get('action') == 'route' and r.get('outbound') == 'direct-out' and set(r) == {'action', 'outbound'})
          assert proxy < fallback
          direct = next(i for i, r in enumerate(rules) if r.get('domain_suffix') == ['direct.example'])
          assert block < direct < proxy
          assert rules[direct]['outbound'] == 'direct-out'
          assert next(s for s in config['dns']['servers'] if s['tag'] == 'default-dns')['server'] == '223.5.5.5'
          assert 'action' not in config['route']['default_domain_resolver']
          PY
          # Exercise the generated list builder; kernel ipset operations are
          # stubbed here, while the list extraction uses the packaged MIPS UCI.
          python3 - "$rootfs" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          init = (root / 'etc/init.d/homeproxy').read_text()
          start = init.index('gen_chinadns_lists() {')
          end = init.index('\n}\n', start) + 3
          helper = init[start:end].replace('local _dir=/etc/chinadns-ng', 'local _dir="$RUN_DIR/ci-chinadns"')
          (root / 'tmp/check-domain-lists.sh').write_text(helper)
          PY
          check_domain_lists() (
              HP_DIR="$rootfs/etc/homeproxy"
              RUN_DIR="$rootfs/tmp/run/homeproxy"
              uci() { target /sbin/uci "$@"; }
              ipset() { if [ "$1" = restore ]; then cat >/dev/null; fi; return 0; }
              . "$rootfs/tmp/check-domain-lists.sh"
              gen_chinadns_lists
          )
          target /sbin/uci add_list homeproxy.dns_direct.domain_suffix=child.blocked.example
          target /sbin/uci add_list homeproxy.dns_proxy.domain_suffix=child.direct.example
          target /sbin/uci commit homeproxy
          check_domain_lists
          python3 - "$rootfs/tmp/run/homeproxy/ci-chinadns" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          assert (root / 'user_block.txt').read_text() == 'blocked.example\n'
          assert (root / 'user_direct.txt').read_text() == 'direct.example\n'
          assert (root / 'user_proxy.txt').read_text() == 'proxy.example\n'
          PY
          # All three empty UI fields must be inert, especially empty block/direct rules.
          for name in dns_block dns_direct dns_proxy; do
              target /sbin/uci set "homeproxy.$name.domain="
              target /sbin/uci -q delete "homeproxy.$name.domain_suffix" || true
          done
          target /sbin/uci commit homeproxy
          check_domain_lists
          cmp "$rootfs/etc/homeproxy/resources/china_list.txt" "$rootfs/tmp/run/homeproxy/china_list.filtered"
          cmp "$rootfs/etc/homeproxy/resources/gfw_list.txt" "$rootfs/tmp/run/homeproxy/gfw_list.filtered"
          target /usr/bin/ucode -S /etc/homeproxy/scripts/generate_client.uc
          target /usr/bin/sing-box check -c /var/run/homeproxy/sing-box-c.json
          python3 - "$rootfs/tmp/run/homeproxy/sing-box-c.json" <<'PY'
          import json, sys
          rules = json.load(open(sys.argv[1]))['route']['rules']
          assert sum(r == {'action': 'route', 'outbound': 'direct-out'} for r in rules) == 1
          assert not any(r == {'action': 'reject'} for r in rules)
          assert not any(r == {'action': 'route', 'outbound': 'cfg-ci_node-out'} for r in rules)
          PY
          # Switching DNS routing back to native must not retain the QUIC policy.
          target /sbin/uci set homeproxy.config.dns_routing=native
          target /sbin/uci commit homeproxy
          target /usr/bin/ucode -S /etc/homeproxy/scripts/generate_client.uc
          target /usr/bin/sing-box check -c /var/run/homeproxy/sing-box-c.json
          python3 - "$rootfs/tmp/run/homeproxy/sing-box-c.json" <<'PY'
          import json, sys
          rules = json.load(open(sys.argv[1]))['route']['rules']
          assert not any(r.get('action') == 'reject' and r.get('method') == 'default' for r in rules)
          PY
          echo 'Packaged HomeProxy patches, MIPS configuration and user/QUIC policy verified'

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload all compilation products
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.STORE_PRODUCTS == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin/

      - name: Organize firmware-related files
        id: organize-files
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages/
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize-files.outputs.status == 'success' && env.STORE_FIRMWARE == 'true' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Upload firmware to cowtransfer
        id: cowtransfer
        if: steps.organize-files.outputs.status == 'success' && env.COWTRANSFER_FIRMWARE == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
          echo "::notice file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
          echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: Upload firmware to WeTransfer
        id: wetransfer
        if: steps.organize-files.outputs.status == 'success' && env.WETRANSFER_FIRMWARE == 'true' && !cancelled()
        run: |
          curl -fsSL git.io/file-transfer | sh
          ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
          echo "::notice file=wetransfer.com::$(cat wetransfer.log | grep https)"
          echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

      - name: Generate release tag
        id: tag
        if: env.RELEASE_FIRMWARE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "Build from $REPO_URL $REPO_BRANCH" >> release.txt
          [ $COWTRANSFER_FIRMWARE = true -o $WETRANSFER_FIRMWARE = true ] && echo 'Products transfer:' >> release.txt
          [ $COWTRANSFER_FIRMWARE = true ] && echo \
            "ðŸ”— [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
          [ $WETRANSFER_FIRMWARE = true ] && echo \
            "ðŸ”— [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@master
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

  clean:
    name: Clean up old assets
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1

      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@master
        if: env.RELEASE_FIRMWARE == 'true' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
