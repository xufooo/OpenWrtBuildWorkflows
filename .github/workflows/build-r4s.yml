name: Build R4S OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [r4s-build]
    paths:
      - '.github/workflows/build-r4s.yml'
      - 'r4s/**'

permissions:
  contents: read

concurrency:
  group: r4s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison \
            g++-multilib gcc-multilib gettext git libncurses-dev libssl-dev rsync \
            unzip zlib1g-dev file wget curl xz-utils zstd swig libelf-dev gawk \
            ccache clang llvm lld cmake pkgconf time python3 python3-setuptools \
            python3-pyelftools squashfs-tools jq lua5.1
          df -h .
      - name: Check build preparation regressions
        run: |
          python3 -B -m unittest discover -s r4s -p 'test_*.py' -v
          node r4s/test_fullcone_ui.cjs
          lua5.1 r4s/test_policy.lua r4s
      - name: Prepare pinned sources and initial configuration
        run: python3 r4s/build.py prepare "$RUNNER_TEMP/openwrt"
      - name: Configure and verify package selection
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          make defconfig
          python3 "$GITHUB_WORKSPACE/r4s/build.py" check-config "$PWD"
          ./scripts/diffconfig.sh > config.seed.buildinfo
      - name: Download sources
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -o pipefail
          make download -j8 2>&1 | tee download.log
      - name: Verify source integrations
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          make target/linux/prepare V=s
          make package/firewall4/prepare V=s
          make package/feeds/packages/sqm-scripts/prepare V=s
          python3 "$GITHUB_WORKSPACE/r4s/build.py" check-prepared "$PWD"
      - name: Compile firmware
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -o pipefail
          make -j2 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
      - name: Verify and collect firmware and APK packages
        run: python3 r4s/build.py collect "$RUNNER_TEMP/openwrt" "$GITHUB_WORKSPACE/r4s-output"
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: r4s-openwrt-25.12.6-${{ github.run_number }}
          path: r4s-output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4s-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/openwrt/*.log
            ${{ runner.temp }}/openwrt/.config
            ${{ runner.temp }}/openwrt/feeds.conf
            ${{ runner.temp }}/openwrt/*buildinfo
            ${{ runner.temp }}/openwrt/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
