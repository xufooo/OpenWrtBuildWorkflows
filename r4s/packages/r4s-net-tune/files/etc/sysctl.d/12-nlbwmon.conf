# nlbwmon asks for a 512 KiB netlink receive buffer (netlink_buffer_size).
# The kernel caps SO_RCVBUF at net.core.rmem_max, whose upstream default is
# 212992, so the conntrack dump fails on every refresh. nlbwmon itself reports
# the value it needs; this is not one of the 64 MB throughput ceilings.
net.core.rmem_max = 524288
